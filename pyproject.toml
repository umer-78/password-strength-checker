[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passcheck"
version = "1.0.0"
description = "Offline password strength analyzer: entropy, pattern detection and actionable feedback."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
passcheck = "passcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
